<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayelet Cohen Photography</title>
  <meta name="description" content="Ayelet Cohen Photography">
  <style>
    :root { color-scheme: light dark; --bg: #f7f5f2; --fg: #1c1b19; --muted: #6f6b65; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #f2efea; --muted: #a09b93; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100svh; background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif; }
    main { width: min(100%, 72rem); margin: 0 auto; padding: clamp(3rem, 10vh, 6rem) 1rem 4rem; }
    header { text-align: center; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 400; letter-spacing: .01em; }
    .tagline { margin-top: .5rem; color: var(--muted); font-size: .85rem; letter-spacing: .28em; text-transform: uppercase; }
    footer { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 1.5rem; margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid color-mix(in srgb, var(--fg) 15%, transparent); }
    footer:empty { display: none; }
    a { color: inherit; }
    section { margin-top: 3.5rem; }
    h2 { margin-bottom: 1rem; font-size: 1.4rem; font-weight: 400; overflow-wrap: anywhere; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); gap: 1rem; }
    .grid img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: color-mix(in srgb, var(--fg) 8%, transparent); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ayelet Cohen</h1>
      <p class="tagline">Photography</p>
    </header>
    <div id="albums"></div>
    <footer id="contact"></footer>
  </main>
  <script>
    // WhatsApp needs an international number. Local Israeli numbers start with 0.
    function whatsappLink(phone) {
      const digits = phone.replace(/[^0-9]/g, "");
      const international = phone.trim().startsWith("+") ? digits : digits.replace(/^0/, "972");
      return "https://wa.me/" + international;
    }

    async function showSite() {
      const response = await fetch("/api/site", { cache: "no-store" });
      if (!response.ok) return;
      const site = await response.json();

      const contact = document.getElementById("contact");
      if (site.phone) {
        const phone = document.createElement("a");
        phone.href = whatsappLink(site.phone);
        phone.rel = "noopener";
        phone.textContent = site.phone;
        contact.append(phone);
      }
      if (site.instagram) {
        const instagram = document.createElement("a");
        instagram.href = site.instagram;
        instagram.rel = "noopener";
        instagram.textContent = "Instagram";
        contact.append(instagram);
      }

      const albums = document.getElementById("albums");
      for (const album of site.albums) {
        if (album.photos.length === 0) continue;
        const section = document.createElement("section");
        const title = document.createElement("h2");
        title.textContent = album.name;
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const id of album.photos) {
          const link = document.createElement("a");
          link.href = "/photos/" + id;
          const image = document.createElement("img");
          image.src = link.href;
          image.alt = "Photograph from " + album.name;
          image.loading = "lazy";
          link.append(image);
          grid.append(link);
        }
        section.append(title, grid);
        albums.append(section);
      }
    }
    showSite().catch(() => {});
  </script>
</body>
</html>
