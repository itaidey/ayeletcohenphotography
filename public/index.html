<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayelet Cohen Photography</title>
  <meta name="description" content="Ayelet Cohen Photography">
  <style>
    :root { color-scheme: light dark; --bg: #f7f5f2; --fg: #1c1b19; --muted: #6f6b65; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #f2efea; --muted: #a09b93; } }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-content: center; gap: .75rem;
      padding: 1.5rem; text-align: center; background: var(--bg); color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
    }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 400; letter-spacing: .01em; }
    p { color: var(--muted); font-size: .85rem; letter-spacing: .28em; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Ayelet Cohen</h1>
  <p>Photography</p>
</body>
</html>
